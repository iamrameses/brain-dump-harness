[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-dump-harness"
version = "0.1.0"
description = "Zero-token ingest-landing harness + migration toolchain for the brain-dump vault."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["tests*"]
